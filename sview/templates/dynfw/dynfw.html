{% extends "layout.html" %} 
{% block body %}
<div class="row">
    <div class="col-lg-12 pb-3" align="center">
        <div
            id="world_map"
            class="world-map"
            style="position: relative; width: 900; height: 300px"
        ></div>
    </div>
</div>
<div class="card mb-4 shadow-sm">
    <div class="card-body">
        <table class="table table-hover table-borderless mb-0">
            <tr>
                <th>Status</th>
                <td id="status_status">Waiting for connection...</td>
            </tr>
            <tr>
                <th>Updated</th>
                <td id="status_updated">Waiting for data...</td>
            </tr>
            <tr>
                <th>Current list version / Serial</th>
                <td>
                    <span id="status_list_version">Waiting for data...</span> /
                    <span id="status_serial">Waiting for data...</span>
                </td>
            </tr>
        </table>
    </div>
</div>
<div class="row">
    <div class="col-lg-4">
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-0">Events</h5>
            </div>
            <ul id="latest_event" class="list-group list-group-flush"></ul>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-0">Updates</h5>
            </div>
            <ul id="latest_data" class="list-group list-group-flush"></ul>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="card mb-4 shadow-sm">
            <div
                class="card-body d-flex justify-content-between align-items-center"
            >
                <div class="d-flex align-items-center flex-grow-1">
                    <h5 class="mb-0 text-nowrap">Current list</h5>
                    <span
                        id="list_cnt"
                        class="badge badge-secondary badge-pill ml-2"
                    ></span>
                    <input
                        id="list_filter"
                        type="text"
                        class="form-control form-control-sm ml-2"
                        placeholder="Filter IPs…"
                        autocomplete="off"
                        style="height: 24px"
                    />
                </div>
            </div>
            <ul id="latest_list" class="list-group list-group-flush"></ul>
            <div id="list_controls" class="card-body py-2 d-none">
                <button
                    id="expand_list"
                    type="button"
                    class="btn btn-sm btn-outline-secondary flex-fill d-none"
                >
                    Show more
                </button>
                <button
                    id="collapse_list"
                    type="button"
                    class="btn btn-sm btn-outline-secondary flex-fill d-none"
                >
                    Show less
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
